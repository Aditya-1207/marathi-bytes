    <title>प्राजक्तप्रभा - Marathi Creative Blog</title>
    <script type="text/javascript">
      // Counterpart to public/404.html's redirect: restores the real path that was
      // encoded into the query string, before the app mounts and wouter reads the URL.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
